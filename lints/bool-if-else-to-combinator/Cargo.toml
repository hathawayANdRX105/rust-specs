[package]
name = "bool_if_else_to_combinator"
version = "0.1.0"
authors = ["authors go here"]
description = "a bool if/else that rebuilds an Option/Result must use then_some/then/ok_or/ok_or_else"
edition = "2024"
publish = false

[lib]
