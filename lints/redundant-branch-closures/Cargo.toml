[package]
name = "redundant_branch_closures"
version = "0.1.0"
authors = ["authors go here"]
description = "detect two no-arg closures used as both branches of a let-bound pick_with or if-else"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dioxus-rsx-scan = { path = "../../support/dioxus-rsx-scan" }
dylint_linting = "6.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true
