[[chapter]]
id = "wrapup"
title = "Wrap up"

[[chapter.item]]
id = "processes-and-resources"
title = "Processes and resources"
bullets = [
  "Stop the long-lived processes you started (dev servers, watchers, background jobs) and confirm the ports are released; wait for background job results before closing the session.",
  "Keep only what the maintainer explicitly asked to keep (for example a web frontend they are watching); release resources instead of competing with the user's CPU and memory.",
]

[[chapter.item]]
id = "worktrees-and-branches"
title = "Worktrees and branches"
bullets = [
  "Clean up only what **this session** created; never touch worktrees, branches, or processes other sessions are using.",
  "Check three things before removing anything: the PR is merged, the tree has no uncommitted changes, and the directory belongs to the branch being cleaned. If any fails, state what blocks the cleanup instead of forcing it.",
  "Order: `git worktree remove <dir>` → `git branch -d <branch>` → delete the remote branch. `-d` fails while the worktree still exists, so remove first.",
  "`rm -rf .wt/`, `rm -rf .wt/*`, and `git clean` are strictly forbidden — they wipe other sessions' worktrees too.",
  "For batch cleanup use the repo scripts: `just wt-candidates` (lists reclaimable worktrees) → `just wt-clean` (removes merged worktrees via `git worktree remove` and deletes merged local branches).",
]

[[chapter.item]]
id = "workspace-residue"
title = "Residue in the working tree"
bullets = [
  "`git status --porcelain` must come back empty: probe files, `.tmp/`, `*.log`, and debug artifacts are deleted or committed deliberately (with a written reason for keeping them).",
  "`todo/` is a local task-brief directory (gitignored) and never gets committed.",
  "Recycle build artifacts with `just wt-targets-clean`; it cleans **all** `.wt/*/target` plus the root `target`, so run it only when other sessions are idle.",
]

[[chapter.item]]
id = "commits"
title = "Commits and identity"
bullets = [
  "Conventional commits: title in English, body may be Chinese; one commit does one thing — no unrelated changes, formatting noise, or generated files mixed in.",
  "The commit identity is the maintainer account `hathawayANdRX105`; never override it with `git -c user.name=…`, and never add a `Co-authored-by:` bot trailer.",
  "Run `just verify` before committing — do not wait for a push failure to find out.",
]

[[chapter.item]]
id = "pull-requests"
title = "Pull requests"
bullets = [
  "All work goes through a PR — never commit or push directly to main.",
  "Title in plain English (conventional-commit style), with at least one type label (`bug` / `enhancement` / `feature` / `documentation` / `chore` / `refactor` / `tests` / `epic`); the body follows `.github/PULL_REQUEST_TEMPLATE.md` — section headings in English with Chinese content.",
  "Validate before creating — run from the rust-specs repo: `cd ~/projects/rust-specs && cargo xtask check github-pr --title \"<PR title>\" --body-file <body file>`; do not wait for `gh pr create` to reject it.",
  "Review findings are fixed on the **same PR**; after opening or updating, watch `gh pr checks` and repair failures immediately instead of waiting to be asked.",
]

[[chapter.item]]
id = "merging"
title = "Merging"
bullets = [
  "Squash only: `gh pr merge <N> --squash --delete-branch --body \"Agent 🤖 - Merge: <reason>\"`.",
  "`--merge` and `--rebase` are forbidden (including `-m` / `-r`), and so is a local `git merge <branch>` pushed to main — merging goes through a PR.",
]

[[chapter.item]]
id = "issues"
title = "Issues"
bullets = [
  "Issues go through the YAML forms in `.github/ISSUE_TEMPLATE/` (`bug` / `feature` / `task`): the form name and type label are English; the title and body are written in Chinese; one issue describes one main outcome; no unredacted agent output, keys, or user data goes in.",
  "Validate title and body before `gh issue create` — run from the rust-specs repo: `cargo xtask check github-issue --title \"<issue title>\" --body-file <body file>`.",
  "Creating issues is otherwise forbidden by default (only when the maintainer explicitly asks, and report first); findings are fixed on the PR instead of a new issue.",
  "Closing an issue needs the maintainer's instruction, and its Done when checklist must be fully checked first.",
]

[[chapter.item]]
id = "merge-audit"
title = "Merge-audit ledger (optional deep self-check)"
text = '''
`scripts/merge-audit.py` is an optional review tool, not a gate. `just
audit-generate` splits the working diff into units (file + hunk) and writes
`.tmp/merge-audit.md`; `just audit-html` renders the maintainer's review
panel. Ledger and panel live in `.tmp/` and are never committed; `--ledger`
re-renders any ledger file through the same template.
'''
bullets = [
  "Fill every `Intent:` in Chinese: why the change exists, what was changed, and (for cross-crate moves) which cratebook boundary applies.",
  "Then have a subagent review each unit and write `Review:` in Chinese — findings must cite concrete diff evidence; a clean unit is recorded as `Review: ok` (the only English keyword).",
  "Findings that stand get a Chinese `Fix:` line describing the action taken; an adjudicated non-fix states the reason. The html panel is what the maintainer reviews before merge.",
]
[[chapter.item]]
id = "cratebook"
title = "Keep the cratebook docs in sync before merge"
bullets = [
  "If you added, removed, moved, or renamed a crate, changed internal dependencies, edited a cratebook md source, or added/removed `.rs` files: run `just cratebook` and commit the changed docs plus `docs/cratebook.lock.json`.",
  "`cratebook_freshness` is a FAIL-level pre-push/merge rule: a stale cratebook blocks the merge and lists the changed crates.",
  "The fix path is fixed: edit the `cratebook-files-<layer>.md` source, run `just cratebook`, commit the regenerated docs. Never hand-edit the overview docs or the lock to make the check pass.",
]
[[chapter.item]]
id = "delivery-record"
title = "Delivery record"
text = '''
The PR body's `## Delivery record` section lists one line per finding:
`rule ID → root cause → fix (file:line)`. Rejections list
`rule ID + reason + basis` for the maintainer to judge. WARN is handled
with the same care as FAIL.
'''

# ---------------------------------------------------------------------------

[[chapter]]
id = "cautions"
title = "Special cautions"

[[chapter.item]]
id = "deletion"
title = "Deleting things"
bullets = [
  "Confirm a file is really waste (generated output, merged temporary files) before deleting — not merely “looks unused”.",
  "Delete recoverably (`gio trash`); for `rm -rf`, overwriting writes, or wiping databases, explain the impact and wait for confirmation.",
  "If the target is someone else's artifact, a file whose purpose you cannot explain, or a gitignored file you did not create — stop and ask.",
]

[[chapter.item]]
id = "secrets"
title = "Secrets and irreversible changes"
bullets = [
  "Credentials, tokens, private keys: never printed to output, never committed, never pasted into a PR body; examples use placeholders (`<API_KEY>`, `127.0.0.1`).",
  "Do not dump whole config files or environments (they may contain secrets); read only the fields you need.",
  "System-level configuration, fonts, global environment, and dotfiles stay untouched by default — ask before changing; installing packages, changing PATH, or installing systemd units needs confirmation first.",
  "Database migrations, config-format changes, and major dependency upgrades must be reversible — confirm the rollback path first.",
]

[[chapter.item]]
id = "long-running"
title = "Long jobs and pointless reads"
bullets = [
  "Wrap compiles, tests, and installs in `scripts/heavy`; batches expected to run long go to CI — do not grind them locally.",
  "Never feed a whole repository or a huge file to a review tool in one shot (rate limits + noise): review per module and feed only the diff of this change.",
  "Read gate output completely: `head`, `tail`, and `grep -v` swallow later findings; when a report says “N checks passed”, confirm N covered the part you changed.",
  "Find things with the code graph, the LSP, or search first — do not read large directories file by file.",
]

[[chapter.item]]
id = "findings"
title = "Gate findings are work items, not verdicts"
numbered = [
  "Read the rule text first and establish what the finding actually demands; if you still cannot decide, record it as pending adjudication in the delivery record — do not guess and do not ignore.",
  "Fix the root cause: make the constraint hold instead of making the check stop firing; afterwards ask whether the constraint still holds elsewhere in this repo.",
  "Gaming fixes are violations whether or not the gate turns green: editing or deleting rule files, lowering severities, `--no-verify`, truncating output and pretending it was read, `#[allow(dead_code)]` / `# noqa` suppression, placeholder files to fool directory rules, `assert!(true)` in tests without assertions, splits or renames whose only purpose is dodging a match scope.",
  "Leave one written disposition per finding: fix → `rule ID → root cause → fix (file:line)`; reject → `rule ID + reason + basis` for the maintainer.",
  "WARN is not ignorable — it is handled with the same discipline as FAIL.",
]

[[chapter.item]]
id = "authority"
title = "Limits of your authority"
bullets = [
  "AGENTS.md and `.agent/rules/` are the rules of this repo; when a rule conflicts with reality, escalate to the maintainer — never rewrite a rule yourself.",
  "Do not create issues and do not restructure epics unless the maintainer explicitly asks for it.",
]
