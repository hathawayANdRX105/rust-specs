[[chapter]]
id = "testing"
title = "Test"

[[chapter.item]]
id = "ci-vs-local"
title = "Division of labor: CI runs the heavy work, you run the light work"
bullets = [
  "**CI is the main battlefield**: a PR may merge only when its `shell-ci` status is green; the full suite runs automatically after every main push (`shell-ci-full`, asynchronous, does not block merges). Watch runs with `gh run watch <run-id> -R hathawayANdRX105/ferrite-ci --exit-status` (`--compact` shows relevant/failed steps only) instead of repeatedly polling `gh pr checks`.",
  "Run locally: `just test-fast` (the only local test entry; testless selects affected cases from the diff and exits loudly on anomalies or zero hits — it never skips silently).",
  "Also cheap locally: `cargo check -p <crate>`, `cargo clippy -p <crate> --all-targets -- -D warnings`, `cargo fmt --check`, and single-case debugging that finishes in about three seconds.",
  "Forbidden locally: whole-package tests, a full test binary, e2e, `just test`, and `just test-scoped` / `scripts/test-full.sh` (conditional full runs are CI-only; `just test` refuses and prints the dispatch command). For a full run: `gh workflow run ci-dispatch.yml --ref <branch> -f full=true`.",
]

[[chapter.item]]
id = "local-checks"
title = "Checks you can run locally"
[[chapter.item.table]]
headers = ["Purpose", "Command"]
rows = [
  ["Everything (fmt + clippy + check + gates)", "`just verify`"],
  ["Spec gates (repo rules + dioxus lint)", "`just gate`"],
  ["Repo rules alone", "`cargo xtask check --root . --scope changed --base origin/main --class deterministic`"],
  ["Semantic layer (jev)", "the same command plus `--class semantic`"],
  ["Rust syntax rules", "rust-specs dylint (see the code chapter)"],
  ["GitHub PR / issue format", "rust-specs `cargo xtask check github-pr` / `github-issue` (see the wrap-up chapter)"],
]

[[chapter.item]]
id = "test-authoring"
title = "How tests are written here"
bullets = [
  "Unit tests sit at the bottom of the source file that owns the code (`#[cfg(test)] mod <name>_tests;`, code in a sibling `<name>_tests.rs`); integration and contract tests live in the root `tests/` directory; assert **real behavior** — never decorate with `assert!(true)`.",
  "Every test carries a comment stating its purpose, the scenario it covers, and the acceptance condition being asserted — in English, above the test function.",
  "Fix bugs by reproducing first, then verify the reproduction path no longer triggers; when a test fails, decide whether the implementation or the test is wrong — never bend the test to the implementation.",
  "For anything you could not verify (missing runtime, credentials, hardware), write “not verified + why”; never report “did not run” as “passed”.",
]

[[chapter.item]]
id = "ci-failures"
title = "When CI fails"
text = '''
Look at the concrete job with `gh pr checks <PR>` and fix it on the
**same PR** — failed checks are not an excuse to open another PR.
'''

