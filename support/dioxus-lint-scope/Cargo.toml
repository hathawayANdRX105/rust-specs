[package]
name = "dioxus-lint-scope"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
# rustc_private crates cannot be linked by the test harness; the pure path
# predicates (and their tests) live in `dioxus-lint-paths`.
test = false
doctest = false

[dependencies]
dioxus-lint-paths = { path = "../dioxus-lint-paths" }

[package.metadata.rust-analyzer]
rustc_private = true
