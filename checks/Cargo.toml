[package]
name = "checks"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "checks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
regex = "1"
ureq = { version = "2", features = ["json"] }